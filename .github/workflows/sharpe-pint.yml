name: Generate Sharpe Pint

on:
  schedule:
    # Early London morning. GitHub scheduled jobs can be delayed or dropped,
    # so the second slot is a backup. The job skips if today's issue exists.
    - cron: "17 5 * * *"
    - cron: "47 6 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TZ: Europe/London

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check whether today's issue already exists
        id: today
        run: |
          TODAY="$(date +%F)"
          echo "date=$TODAY" >> "$GITHUB_OUTPUT"
          if ls "public/sharpe-pint/data/${TODAY}_"*.json >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Issue already exists for $TODAY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate briefing
        if: steps.today.outputs.skip != 'true'
        run: python scripts/generate_sharpe_pint.py --date "${{ steps.today.outputs.date }}" --output-dir /tmp/sharpe-pint-output
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SECTION_MODEL: gemini-3.5-flash
          GEMINI_EDITOR_MODEL: gemini-3.5-flash

      - name: Commit generated data
        if: steps.today.outputs.skip != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/sharpe-pint/data/*.json data/previous_ideas.json
          git commit -m "Generate daily Sharpe Pint" || exit 0
          git push
